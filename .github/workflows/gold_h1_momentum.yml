name: Gold H1 Momentum Score (Buy + Sell + Net)

on:
  schedule:
    # รันทุก 4 ชม. จันทร์-ศุกร์
    # 02:10, 06:10, 10:10, 14:10, 18:10, 22:10 UTC
    - cron: '10 2,6,10,14,18,22 * * 1-5'
  workflow_dispatch:

jobs:
  h1-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GOLD_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy openpyxl

      - name: "Step 1: Update H1 + H4 price data"
        run: python3 update_gold_intraday.py

      - name: "Step 2: Run H1 Momentum Score — BUY"
        run: python3 gold_momentum_h1.py

      - name: "Step 3: Run H1 Momentum Score — SELL"
        run: python3 gold_momentum_h1_sell.py

      - name: "Step 4: Calculate H1 Net Bias"
        run: python3 gold_momentum_h1_net.py

      - name: "Step 5: Commit and push"
        run: |
          git config user.email "jptrustlearning@users.noreply.github.com"
          git config user.name "JP Trust Learning"

          git add gold_prices_h1.csv gold_prices_h4.csv
          git add output_momentum_gold_h1.csv 2>/dev/null || true
          git add output_momentum_gold_h1_*.csv 2>/dev/null || true
          git add output_momentum_gold_h1_sell.csv 2>/dev/null || true
          git add output_momentum_gold_h1_sell_*.csv 2>/dev/null || true
          git add output_momentum_gold_h1_net.csv 2>/dev/null || true
          git add output_momentum_gold_h1_net_*.csv 2>/dev/null || true

          git diff --cached --quiet || (
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "🥇 Gold H1 Momentum (Buy+Sell+Net) — ${TIMESTAMP}"
            git push
          )
