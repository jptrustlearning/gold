name: TEMP Fetch GC=F corrected tail

# ── ไฟล์ชั่วคราว (18 ส.ค. 2026) ─────────────────────────────────
# ดึงแท่ง GC=F รายวันฉบับ corrected จาก Yahoo ย้อน 30 วัน
# เขียนเป็น gcf_tail_check.csv เพื่อเอาไปเทียบ/ซ่อมแถวท้าย gold_prices.csv
# ใช้เสร็จแล้วลบทิ้งทั้ง workflow และไฟล์ผลลัพธ์
# ────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GOLD_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - name: Fetch GC=F last 30 days
        run: |
          python3 << 'EOF'
          import yfinance as yf
          import pandas as pd
          df = yf.Ticker('GC=F').history(period='1mo', interval='1d')
          assert not df.empty, 'Yahoo GC=F returned empty'
          df = df[['Open','High','Low','Close','Volume']].reset_index()
          df.rename(columns={df.columns[0]: 'Date'}, inplace=True)
          if df['Date'].dt.tz is not None:
              df['Date'] = df['Date'].dt.tz_localize(None)
          df['Date'] = df['Date'].dt.strftime('%Y-%m-%d')
          for c in ['Open','High','Low','Close']:
              df[c] = df[c].round(1)
          df['Volume'] = df['Volume'].astype(int)
          df.to_csv('gcf_tail_check.csv', index=False)
          print(df.to_string())
          EOF
      - name: Commit result
        run: |
          git config user.email "actions@github.com"
          git config user.name "JP Trust Learning"
          git add gcf_tail_check.csv
          git commit -m "temp: GC=F corrected tail 30d (สำหรับซ่อมแถวท้าย gold_prices.csv)"
          git pull --rebase
          git push
