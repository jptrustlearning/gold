name: "PROBE — เช็คแหล่งราคาทอง (เขียนผลลง PROBE_RESULT.md)"

# workflow_dispatch อย่างเดียว — ไม่แตะ gold_prices.csv หรือไฟล์ข้อมูลใดๆ
# commit เฉพาะ PROBE_RESULT.md เพื่อให้อ่านผลได้โดยไม่ต้องเปิด log ของ Actions

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GOLD_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: "Probe spot gold sources"
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.error, io, time
          import pandas as pd
          from datetime import datetime, timezone

          out = []
          def w(line=''):
              print(line)
              out.append(str(line))

          w('# PROBE RESULT')
          w()
          w(f'- run UTC: `{datetime.now(timezone.utc).isoformat()}`')
          try:
              import yfinance as yf
              w(f'- yfinance: `{yf.__version__}`  ·  pandas: `{pd.__version__}`')
          except Exception as e:
              yf = None
              w(f'- yfinance import ล้มเหลว: `{e!r}`')
          w()

          # ── 1) stooq ────────────────────────────────────────────────
          w('## 1) stooq')
          URLS = [
              'https://stooq.com/q/d/l/?s=xauusd&i=d&d1=20260801&d2=20260819',
              'https://stooq.com/q/d/l/?s=xauusd&i=d',
              'https://stooq.pl/q/d/l/?s=xauusd&i=d',
          ]
          for u in URLS:
              w(f'### `{u}`')
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 jptrust-probe'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      code = r.status
                      body = r.read().decode('utf-8', 'replace')
                  w(f'- HTTP `{code}` · {len(body)} bytes')
                  w('```')
                  w(body[:400].strip())
                  w('```')
                  if body.lstrip().lower().startswith('date'):
                      t = pd.read_csv(io.StringIO(body))
                      w(f'- parsed OK: {len(t)} rows · cols `{list(t.columns)}`')
                      w(f'- first `{t.iloc[0,0]}` · last `{t.iloc[-1,0]}`')
                      w('```')
                      w(t.tail(6).to_string(index=False))
                      w('```')
              except urllib.error.HTTPError as e:
                  w(f'- HTTPError `{e.code}` — {e.reason}')
              except Exception as e:
                  w(f'- ล้มเหลว: `{e!r}`')
              w()
              time.sleep(3)

          # ── 2) yahoo symbols ────────────────────────────────────────
          w('## 2) Yahoo (yfinance)')
          if yf is not None:
              for sym in ['XAUUSD=X', 'XAU=X', 'GC=F', 'GLD']:
                  w(f'### `{sym}`')
                  try:
                      h = yf.Ticker(sym).history(period='1mo', interval='1d')
                      if h is None or h.empty:
                          w('- EMPTY (ไม่มีข้อมูลรายวัน)')
                      else:
                          w(f'- {len(h)} rows · index tz `{h.index.tz}`')
                          w(f'- ชั่วโมงของ timestamp: `{pd.Series(h.index.hour).value_counts().to_dict()}`')
                          w('```')
                          w(h.tail(6)[['Open','High','Low','Close','Volume']].to_string())
                          w('```')
                  except Exception as e:
                      w(f'- ล้มเหลว: `{e!r}`')
                  w()
                  time.sleep(8)

          # ── 3) ไฟล์ปัจจุบัน ─────────────────────────────────────────
          w('## 3) gold_prices.csv ปัจจุบัน')
          cur = pd.read_csv('gold_prices.csv', encoding='utf-8-sig')
          cur.columns = ['Date','Open','High','Low','Close','Volume']
          w(f'- {len(cur)} rows · first `{cur["Date"].iloc[0]}` · last `{cur["Date"].iloc[-1]}`')
          w('```')
          w(cur.tail(6).to_string(index=False))
          w('```')

          with open('PROBE_RESULT.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(out) + '\n')
          print('\n>>> เขียน PROBE_RESULT.md แล้ว')
          PYEOF

      - name: "Commit PROBE_RESULT.md"
        run: |
          git config user.email "jptrustlearning@users.noreply.github.com"
          git config user.name "JP Trust Learning"
          git add PROBE_RESULT.md
          if git diff --cached --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "probe: ผลตรวจแหล่งราคาทอง spot ($(date -u +'%d/%m/%Y %H:%M UTC'))"
            git pull --rebase --autostash || true
            git push
          fi
